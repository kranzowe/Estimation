ekf_localization:
  ros__parameters:
    # Set at launch from the map_server yaml argument; do NOT hard-code unless
    # bypassing the launch file.
    map_yaml: ""

    # Initial pose in the map frame (meters, radians).
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0

    # Process noise stddev per sqrt(s) — Q = diag(q^2 * dt) per step.
    # q_xy: translational drift (commanded velocity vs actual).
    # q_yaw: gyro bias / integration noise.
    q_xy: 0.05
    q_yaw: 0.03

    # Measurement noise stddev for ICP-corrected pose.
    # Lower r_* => trust the scan-match more (faster snap to walls, jumpier).
    r_xy: 0.05
    r_yaw: 0.03

    # ICP tuning.
    icp_max_iters: 15
    icp_max_corr_dist: 0.5         # meters; nearest-neighbor cutoff
    icp_residual_reject: 0.30      # meters; reject update if mean residual exceeds this

    # Scan downsampling.
    scan_stride: 2                 # use every Nth beam
    scan_min_range: 0.20
    scan_max_range: 12.0

    # Frames.
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser
    map_frame: map

    # Predict-step rate (Hz).
    predict_rate: 50.0
